# Blueprint de Render: https://render.com/docs/blueprint-spec
# Los valores secretos (sync: false) se introducen en el panel de Render, nunca aquí.
services:
  - type: web
    name: alertas-legales
    runtime: docker
    region: frankfurt # datos en la UE (RGPD)
    plan: free # gratis; el panel se duerme tras 15 min sin uso (las alertas no se ven afectadas)
    healthCheckPath: /salud
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TIMEZONE
        value: Europe/Madrid
      - key: STORAGE_BACKEND
        value: s3
      - key: HOLIDAYS_SUBDIV
        sync: false
      - key: FIRM_NAME
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FIRM_ALERT_EMAILS
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        sync: false
