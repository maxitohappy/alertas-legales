name: CI y seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # auditoría semanal de dependencias

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Análisis estático de seguridad (bandit)
        run: bandit -r app scripts -c pyproject.toml
      - name: Dependencias vulnerables (pip-audit)
        run: pip-audit -r requirements.txt
