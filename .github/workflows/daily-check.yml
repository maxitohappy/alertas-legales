name: Revisión diaria de casos

on:
  schedule:
    - cron: "0 6 * * *" # 07:00 (invierno) / 08:00 (verano) hora de Madrid
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha a revisar (AAAA-MM-DD). Vacío = hoy"
        required: false
      dry_run:
        description: "Simular sin enviar correos"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: envio-correos
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      FIRM_NAME: ${{ secrets.FIRM_NAME }}
      FIRM_ALERT_EMAILS: ${{ secrets.FIRM_ALERT_EMAILS }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      HOLIDAYS_SUBDIV: ${{ vars.HOLIDAYS_SUBDIV }}
      TIMEZONE: Europe/Madrid
      # Acceso al almacenamiento para adjuntar los documentos recibidos al aviso del despacho
      STORAGE_BACKEND: ${{ secrets.S3_BUCKET && 's3' || 'local' }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
    steps:
      - name: Comprobar configuración
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Secret DATABASE_URL no configurado todavía; se omite la revisión."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: steps.cfg.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Aplicar migraciones
        if: steps.cfg.outputs.ready == 'true'
        run: alembic upgrade head

      - name: Revisar casos y enviar alertas
        if: steps.cfg.outputs.ready == 'true'
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          if [ "$INPUT_DRY" = "true" ]; then args+=(--dry-run); fi
          python -m app.jobs.daily_check "${args[@]}"
