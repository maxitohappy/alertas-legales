{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Iniciar sesión</h1>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <label>Correo <input type="email" name="email" required autocomplete="username" maxlength="254"></label>
    <label>Contraseña <input type="password" name="password" required autocomplete="current-password" maxlength="256"></label>
    <button>Continuar</button>
  </form>
</section>
{% endblock %}
